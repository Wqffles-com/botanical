# Opt-in coding CLIs inside the API container. This file does not change
# `docker compose up` by itself.
#
#   BOTANICAL_CLI_PROFILES=grok-build
#   docker compose -f docker-compose.yml -f docker-compose.cli.yml up --build -d
#
# The server installs the Linux build of each enabled CLI into the cli_bin
# volume and keeps CLI config in the cli_home volume. Docker Desktop on
# Windows and macOS needs no WSL install and no host binary. Sign in from
# Settings → Coding CLIs, or with the terminal commands in docs/DEPLOY.md.
#
# Optional pins (latest stable when unset):
#   BOTANICAL_GROK_VERSION, BOTANICAL_CLAUDE_VERSION, BOTANICAL_CODEX_VERSION
# BOTANICAL_CLI_AUTO_INSTALL=0 skips install at process start. Install still
# works from the settings page.
#
# Linux-only alternative, not required: bind-mount a host binary and a host
# config directory instead of the named volumes.
#
# services:
#   server:
#     volumes:
#       - ${BOTANICAL_GROK_BIN}:/opt/botanical-cli/bin/grok:ro
#       - ${BOTANICAL_CLI_HOME}:/home/botanical

services:
  server:
    environment:
      HOME: /home/botanical
      BOTANICAL_CLI_HOME: /home/botanical
      BOTANICAL_CLI_BIN: /opt/botanical-cli
      BOTANICAL_CLI_PROFILES: ${BOTANICAL_CLI_PROFILES:-grok-build}
      BOTANICAL_CLI_AUTO_INSTALL: ${BOTANICAL_CLI_AUTO_INSTALL:-1}
      BOTANICAL_GROK_VERSION: ${BOTANICAL_GROK_VERSION:-}
      BOTANICAL_CLAUDE_VERSION: ${BOTANICAL_CLAUDE_VERSION:-}
      BOTANICAL_CODEX_VERSION: ${BOTANICAL_CODEX_VERSION:-}
      USE_BUILTIN_RIPGREP: "0"
      PATH: /opt/botanical-cli/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    volumes:
      - cli_bin:/opt/botanical-cli
      - cli_home:/home/botanical

volumes:
  cli_bin:
  cli_home:
