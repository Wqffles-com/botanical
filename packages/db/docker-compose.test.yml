# Throwaway Postgres for store integration tests.
# Project: botanical-mvp-test. Host port: 5434.
# Do not reuse the botanical (5432) or botanical-mvp (5433) stacks.
name: botanical-mvp-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: botanical
      POSTGRES_PASSWORD: botanical
      POSTGRES_DB: botanical
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botanical -d botanical"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
