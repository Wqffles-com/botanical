# Hosted override. The bundled Postgres service does not start.
# Point DATABASE_URL at managed Postgres, set a real passcode and session
# secret, then boot:
#
#   docker compose -f docker-compose.yml -f docker-compose.saas.yml up --build -d

services:
  postgres:
    profiles: ["bundled-db"]

  server:
    depends_on: !reset []
    environment:
      DEPLOYMENT_MODE: SAAS
      BOTANICAL_DEPLOYMENT_MODE: SAAS
