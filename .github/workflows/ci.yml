name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile

      # web lint has known react-hooks errors and is left out until fixed.
      - name: Typecheck
        run: |
          set -e
          for pkg in agent-runtime core db e2e mcp providers server tools tools-shell tools-web web; do
            echo "::group::typecheck $pkg"
            (cd "packages/$pkg" && bun run typecheck)
            echo "::endgroup::"
          done

      # The shell tools jail commands with unprivileged `unshare`, a read-only
      # /usr, and a fixed PATH. Ubuntu 24.04 runners block user namespaces
      # through AppArmor, and setup-bun installs bun under $HOME.
      - name: Prepare the shell sandbox
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo install -m 0755 "$(command -v bun)" /usr/local/bin/bun

      # e2e needs a running stack, so it is not part of CI.
      - name: Unit tests
        run: |
          set -e
          for pkg in agent-runtime core db mcp providers server tools tools-shell tools-web web; do
            echo "::group::test $pkg"
            (cd "packages/$pkg" && bun run test)
            echo "::endgroup::"
          done

  package:
    name: Build and package
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 20
    outputs:
      name: ${{ steps.meta.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "name=botanical-$v" >> "$GITHUB_OUTPUT"
      - name: Build server + web and zip
        run: bash scripts/release/package.sh "${{ steps.meta.outputs.version }}"
      - name: Smoke test the unzipped release
        run: |
          set -e
          mkdir -p /tmp/smoke
          unzip -q "dist/${{ steps.meta.outputs.name }}.zip" -d /tmp/smoke
          cd "/tmp/smoke/${{ steps.meta.outputs.name }}"
          cp .env.example .env
          sed -i 's|^DATABASE_URL=.*|DATABASE_URL=|' .env
          ./start.sh > /tmp/smoke/run.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health >/dev/null && curl -fsS -o /dev/null http://127.0.0.1:3000/login; then
              echo "release boots"; cat /tmp/smoke/run.log; exit 0
            fi
            sleep 1
          done
          cat /tmp/smoke/run.log
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.name }}
          path: dist/${{ steps.meta.outputs.name }}.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.name }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ needs.package.outputs.name }}.zip
          generate_release_notes: true
