# Local self-host reference: Postgres 16 + the Bun server stub.
# Defaults are for a laptop only. Override passwords before any shared deploy.
# The server image answers GET /health and does not connect to Postgres yet.

name: botanical

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: botanical
      POSTGRES_PASSWORD: botanical
      POSTGRES_DB: botanical
    ports:
      - "5432:5432"
    volumes:
      - botanical-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botanical -d botanical"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      BOTANICAL_MODE: self-host
      BOTANICAL_PASSWORD: changeme
      DATABASE_URL: postgres://botanical:botanical@postgres:5432/botanical
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  botanical-pg:
